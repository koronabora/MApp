plugins { id 'com.android.application' }
def signingFile = file(System.getenv('MAPP_SIGNING_PROPERTIES') ?: "${System.getProperty('user.home')}/.config/mapp/signing.properties")
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
android {
    namespace 'local.mapp'
    compileSdk 36
    defaultConfig {
        applicationId 'local.mapp'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '0.3.3'
        testInstrumentationRunner 'local.mapp.StreamInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile.exists()) {
            privateRelease {
                storeFile file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release { if (signingFile.exists()) signingConfig signingConfigs.privateRelease }
    }
    testBuildType 'release'
    lint { abortOnError true }
}
dependencies { implementation 'org.videolan.android:libvlc-all:3.7.7' }
